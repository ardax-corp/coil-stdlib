name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's older runs. Runs on the
# default branch are never cancelled once started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  fmt:
    name: coil fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install coil (edge)
        uses: ardax-corp/coil-lang/.github/actions/setup-coil@main

      - name: coil fmt --check
        run: coil-fmt --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout coil-time
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-time
          path: .ci/coil-time
          submodules: false

      # coil comes from the coil-lang `edge` release (a snapshot of its main,
      # rebuilt after every green coil-lang CI run) instead of a source build.
      - name: Install coil (edge)
        uses: ardax-corp/coil-lang/.github/actions/setup-coil@main

      - name: Doc examples (`///` code blocks in src)
        run: coil test --doc-tests-only -A --root src --root .ci/coil-time/src src

      - name: Language harness (`coil test`)
        run: |
          set -euo pipefail
          coil test \
            --allow-read --allow-write --allow-net \
            --root .ci/coil-time/src \
            2>&1 | tee /tmp/coil-test.log
