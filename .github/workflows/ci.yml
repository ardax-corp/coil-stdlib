name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Default branch includes M1 prelude::math (atan…tanh, ids 125–135).
      - name: Checkout coil-lang
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-lang
          path: .ci/coil-lang
          submodules: false

      - name: Checkout coil-time
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-time
          path: .ci/coil-time
          submodules: false

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libpcre2-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .ci/coil-lang

      - name: Build coil
        run: cargo build --manifest-path .ci/coil-lang/Cargo.toml

      - name: Language harness (`coil test`)
        run: |
          set +e
          .ci/coil-lang/target/debug/coil test \
            --root .ci/coil-time/src \
            > /tmp/coil-test.log 2>&1
          cat /tmp/coil-test.log
          if grep -q 'FAILED tests/random.hy' /tmp/coil-test.log; then
            exit 1
          fi
          if ! grep -q 'ok   tests/random.hy' /tmp/coil-test.log; then
            echo "random.hy did not report ok"
            exit 1
          fi
          if grep -q 'FAILED tests/num_const.hy' /tmp/coil-test.log; then
            exit 1
          fi
          if ! grep -q 'ok   tests/num_const.hy' /tmp/coil-test.log; then
            echo "num_const.hy did not report ok"
            exit 1
          fi
          if grep -q 'FAILED tests/collections_bitset.hy' /tmp/coil-test.log; then
            exit 1
          fi
          if ! grep -q 'ok   tests/collections_bitset.hy' /tmp/coil-test.log; then
            echo "collections_bitset.hy did not report ok"
            exit 1
          fi
          if grep -q 'FAILED tests/collections_vec.hy' /tmp/coil-test.log; then
            exit 1
          fi
          if ! grep -q 'ok   tests/collections_vec.hy' /tmp/coil-test.log; then
            echo "collections_vec.hy did not report ok"
            exit 1
          fi
          if grep -q 'FAILED tests/collections.hy' /tmp/coil-test.log; then
            exit 1
          fi
          if ! grep -q 'ok   tests/collections.hy' /tmp/coil-test.log; then
            echo "collections.hy did not report ok"
            exit 1
          fi
