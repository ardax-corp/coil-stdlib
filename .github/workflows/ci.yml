name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout coil-time
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-time
          path: .ci/coil-time
          submodules: false

      # coil comes from the coil-lang `edge` release (a snapshot of its main,
      # rebuilt after every green coil-lang CI run) instead of a source build.
      - name: Install coil (edge)
        uses: ardax-corp/coil-lang/.github/actions/setup-coil@main

      - name: Language harness (`coil test`)
        run: |
          set -euo pipefail
          coil test \
            --root .ci/coil-time/src \
            2>&1 | tee /tmp/coil-test.log
