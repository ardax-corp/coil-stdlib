name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels that PR's older runs. Runs on the
# default branch are never cancelled once started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `actions: write` lets a failed job cancel the rest of its run.
permissions:
  contents: read
  actions: write

env:
  CI: "true"

jobs:
  fmt:
    name: coil fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install coil (edge)
        uses: ardax-corp/coil-lang/.github/actions/setup-coil@main

      - name: coil fmt --check
        run: coil-fmt --check src tests

      # Fail fast on pull requests: a failed job cancels the rest of the run,
      # so a quick fix doesn't wait behind jobs that are already moot.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout coil-time
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-time
          path: .ci/coil-time
          submodules: false

      # coil comes from the coil-lang `edge` release (a snapshot of its main,
      # rebuilt after every green coil-lang CI run) instead of a source build.
      - name: Install coil (edge)
        uses: ardax-corp/coil-lang/.github/actions/setup-coil@main

      - name: Doc examples (`///` code blocks in src)
        run: coil test --doc-tests-only -A --root src --root .ci/coil-time/src src

      - name: Language harness (`coil test`)
        run: |
          set -euo pipefail
          coil test \
            --allow-read --allow-write --allow-net \
            --root .ci/coil-time/src \
            2>&1 | tee /tmp/coil-test.log

      # Fail fast on pull requests: a failed job cancels the rest of the run,
      # so a quick fix doesn't wait behind jobs that are already moot.
      - name: Cancel the rest of the run
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
