name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin includes COI-400 Result/? ABI (5032c12ccd4e) and M1 prelude::math.
      - name: Checkout coil-lang
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-lang
          path: .ci/coil-lang
          ref: 5032c12ccd4e378bbafd148a101d321ac3e17959
          submodules: false

      - name: Checkout coil-time
        uses: actions/checkout@v4
        with:
          repository: ardax-corp/coil-time
          path: .ci/coil-time
          submodules: false

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libpcre2-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .ci/coil-lang

      - name: Build coil
        run: cargo build --manifest-path .ci/coil-lang/Cargo.toml

      - name: Language harness (`coil test`)
        run: |
          set -euo pipefail
          .ci/coil-lang/target/debug/coil test \
            --root .ci/coil-time/src \
            2>&1 | tee /tmp/coil-test.log
